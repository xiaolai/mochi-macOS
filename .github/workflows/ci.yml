name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Signing, notarization and the native single-instance E2E stay local: they need a Developer ID and a GUI session.
jobs:
  tests:
    name: Tests (debug, parallel)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      # SwiftPM otherwise lets a target import any module that happens to be built, so a boundary could erode silently.
      - name: Every import is a declared dependency
        run: swift build --build-tests --explicit-target-dependency-import-check error
      - name: Every declared test is discovered
        run: |
          declared=$(grep -rhoE '^\s*(@MainActor )?(private )?func test[A-Za-z0-9_]+' Tests | wc -l | tr -d ' ')
          listed=$(swift test list | grep -c '/')
          echo "declared=$declared listed=$listed"
          [ "$declared" -gt 0 ] && [ "$declared" = "$listed" ]
      - run: swift test --parallel
      - name: Release tooling
        run: python3 -m unittest discover -s scripts/tests
      - name: Formatting
        run: swift format lint --strict --recursive --parallel Sources Tests Package.swift

  release-configuration:
    name: Tests (release configuration)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The shipped binary is built without MOCHI_DEVELOPMENT; test that configuration, not only debug.
      - run: swift test -c release -Xswiftc -enable-testing

  thread-sanitizer:
    name: Tests (Thread Sanitizer)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test --sanitize=thread

  distribution:
    name: Distribution build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version file is valid
        run: python3 scripts/release_support.py version VERSION
      # The release's own bundle script, in the shipped configuration, signed ad hoc since CI has no Developer ID.
      # It builds with the localized-strings list and fails if any interface string is untranslated.
      - name: The distribution app builds and every interface string is translated
        env:
          MOCHI_DISTRIBUTION: 1
          MOCHI_ADHOC_DISTRIBUTION: 1
        run: MOCHI_APP_PATH="$PWD/build/ci/Mochi.app" ./scripts/build-app.sh
      - name: The bundle's metadata matches VERSION
        run: |
          read -r version build <<< "$(python3 scripts/release_support.py version VERSION)"
          python3 scripts/release_support.py metadata build/ci/Mochi.app/Contents/Info.plist "$version" "$build"
      - name: No development probes, retired providers or build-folder paths ship
        run: python3 scripts/release_support.py distribution build/ci/Mochi.app/Contents/MacOS/Mochi build/ci/Mochi.app/Contents/MacOS/mochi-mcp
